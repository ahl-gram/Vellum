name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Independent jobs run in parallel: check-and-test never builds, so it returns
# fast; one build-and-e2e job per lane in E2E_LANES builds dist/ and runs that
# one lane on a runner of its own. PR wall-clock is the longest job, not the sum,
# and every job runs on every trigger, so push-to-main and PRs cover exactly what
# the old single serial job covered.
jobs:
  check-and-test:
    name: check & test
    runs-on: ubuntu-latest
    # An uncapped job inherits GitHub's 360-minute default, and npm test can hang with no red to read (#564); measured 2026-09-11 over the last 20 successful runs, worst 8m12s.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Test
        run: npm test

  build-and-e2e:
    name: build & e2e lane ${{ matrix.lane }}
    runs-on: ubuntu-latest
    strategy:
      # A red lane must not cancel the other one. Merge safety never needed this (a cancelled job is not a pass either), but reading BOTH lanes' verdicts after a red does, which is what #381's retreat ladder asks for.
      fail-fast: false
      matrix:
        # Lane NAMES only, never their suite lists: E2E_LANES in src/cli/e2e-lanes.ts stays the one roster, and test/repo/e2e-tiers.test.ts reds if this list and that roster disagree.
        lane: ["A", "B"]
    # A hung lane is the one failure the outcome rule cannot catch; re-measured 2026-09-11 over the last 20 successful runs, worst 13m14s (the 7m05s this line carried was from an older, shorter suite).
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      # Build the deploy artifact and run the e2e against it, so CI validates the
      # exact dist/ that gets published. Since Sub 5 (#206) `npm run build` IS the
      # Astro build: astro:generate refreshes the public/ runtime trees (engine,
      # bundles, showcases), then `astro build` assembles dist/.
      - name: Build site into dist/
        run: npm run build
      # Every shard rebuilds dist/ rather than downloading one (#623, ruled 2026-09-14), so the hash
      # here is what makes a disagreement between the shards visible instead of silent. nproc and
      # free print the runner shape the matrix is bought for, which nothing here had ever measured.
      - name: Runner shape and dist/ hash
        run: |
          echo "cores: $(nproc)"
          free -m
          echo "dist/ files: $(find dist -type f | wc -l)"
          find dist -type f -exec sha256sum {} + | LC_ALL=C sort | sha256sum
      # One job per lane on its own runner (#623), which retires "two lanes in THIS job, never a
      # matrix" (#381): #266 wanted the matrix and deferred it only on build-once-and-upload artifact
      # plumbing, and the per-shard rebuild above is the ruling that means that plumbing is never built.
      - name: Explorer e2e lane ${{ matrix.lane }} (headless browser, against dist/)
        run: npm run test:e2e:lanes -- --lane ${{ matrix.lane }}
        env:
          # ubuntu-latest ships a real (non-snap) Google Chrome here. Point at it
          # explicitly: findBrowser() would otherwise pick /usr/bin/chromium first,
          # which is snap-confined and can't use a --user-data-dir under /tmp.
          VELLUM_BROWSER: /usr/bin/google-chrome
          # Require a browser so a missing one fails the build loud rather than
          # skipping silently (local runs with no browser still skip).
          VELLUM_REQUIRE_BROWSER: '1'
