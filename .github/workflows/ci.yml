name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Two independent jobs run in parallel: check-and-test never builds, so it
# returns fast; build-and-e2e carries the slow half (build + headless e2e).
# PR wall-clock is the longer half, not the sum. Both jobs run on every trigger,
# so push-to-main and PRs cover exactly what the old single serial job covered.
jobs:
  check-and-test:
    name: check & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Test
        run: npm test

  build-and-e2e:
    name: build & e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      # Build the deploy artifact and run the e2e against it, so CI validates the
      # exact dist/ that gets published. Since Sub 5 (#206) `npm run build` IS the
      # Astro build: astro:generate refreshes the public/ runtime trees (engine,
      # bundles, showcases), then `astro build` assembles dist/.
      - name: Build site into dist/
        run: npm run build
      # Tier trade (#266): a PR runs the fixed smoke tier, so a smoke-green PR CAN merge a
      # regression the full suite would have caught. It surfaces as a red main run just after
      # merge, and revert is cheap here. main and workflow_dispatch always run the full suite, and
      # a PR author who knows the change is risky adds the `full-e2e` label to force it. The label
      # is read at trigger time, so labelling an in-flight run needs a re-run to take effect.
      - name: Explorer e2e (headless browser, against dist/)
        run: npm run test:e2e
        env:
          VELLUM_E2E_SUITES: ${{ (github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-e2e')) && 'smoke' || 'full' }}
          # ubuntu-latest ships a real (non-snap) Google Chrome here. Point at it
          # explicitly: findBrowser() would otherwise pick /usr/bin/chromium first,
          # which is snap-confined and can't use a --user-data-dir under /tmp.
          VELLUM_BROWSER: /usr/bin/google-chrome
          # Require a browser so a missing one fails the build loud rather than
          # skipping silently (local runs with no browser still skip).
          VELLUM_REQUIRE_BROWSER: '1'
