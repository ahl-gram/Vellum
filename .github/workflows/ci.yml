name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Independent jobs run in parallel: each check-and-test shard typechecks, lints, checks the format and runs its slice of the unit files without building, and each build-and-e2e job builds dist/ and runs one lane of E2E_LANES, all on runners of their own; a pull request waits for the longest job, not the sum, and every job runs on every trigger.
jobs:
  check-and-test:
    name: check & test ${{ matrix.shard }} of ${{ strategy.job-total }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # An uncapped job inherits GitHub's 360-minute default, and npm test can hang with no red to read (Issue #564), so each shard's cap sits at about twice its worst run; measured 2026-10-06 at Issue #763 over the fourteen runs whose head held Issue #762's pull request D (main 37526087943 to 37541080266 and nine pull request runs): worst shard JOB 4m46s.
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Test
        run: npm test -- --test-shard=${{ matrix.shard }}/${{ strategy.job-total }}

  build-and-e2e:
    name: build & e2e lane ${{ matrix.lane }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane: ["A", "B", "C", "D"]
    # A hung lane is the one failure the outcome rule cannot catch, and this cap kills a hang rather than budgeting a run, so it sits at about twice the worst real one; measured 2026-10-06 at Issue #763 over the same fourteen runs: worst lane JOB 9m18s (lane C, before this issue re-fitted the lanes, whose slowest is predicted at about 7.5 minutes).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      # Build the deploy artifact and run the e2e against it, so CI validates the
      # exact dist/ that gets published. Since Sub 5 (#206) `npm run build` IS the
      # Astro build: astro:generate refreshes the public/ runtime trees (engine,
      # bundles, showcases), then `astro build` assembles dist/.
      - name: Build site into dist/
        run: npm run build
      - name: Runner shape and dist/ hash
        run: |
          echo "cores: $(nproc)"
          free -m
          echo "dist/ files: $(find dist -type f | wc -l)"
          find dist -type f -exec sha256sum {} + | LC_ALL=C sort | sha256sum
      # One job per lane on its own runner (#623), which retires "two lanes in THIS job, never a
      # matrix" (#381): #266 wanted the matrix and deferred it only on build-once-and-upload artifact
      # plumbing, and the per-shard rebuild above is the ruling that means that plumbing is never built.
      - name: Explorer e2e lane ${{ matrix.lane }} (headless browser, against dist/)
        run: npm run test:e2e:lanes -- --lane ${{ matrix.lane }}
        env:
          # ubuntu-latest ships a real (non-snap) Google Chrome here. Point at it
          # explicitly: findBrowser() would otherwise pick /usr/bin/chromium first,
          # which is snap-confined and can't use a --user-data-dir under /tmp.
          VELLUM_BROWSER: /usr/bin/google-chrome
          # Require a browser so a missing one fails the build loud rather than
          # skipping silently (local runs with no browser still skip).
          VELLUM_REQUIRE_BROWSER: '1'
