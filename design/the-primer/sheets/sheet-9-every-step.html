</style></head><body><h1>Every step, and the room once it is done</h1><p class="intro">The whole ladder at a glance: 81 steps across nine rooms, each pictured from its own still on the built site (once done where the step has a doing, else on arrival), each marked with what the drift check read. The full text is <code>ladder.md</code>.</p><div class="row"><figure style="width:420px"><img src="/out/1155/shots/pictures/explorer--dice.png" style="width:420px" alt=""><figcaption><b>/explorer/ · dice</b>: Press <span class="ch glyph">⚄</span>, the dice beside the seed box. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/explorer--draw.png" style="width:420px" alt=""><figcaption><b>/explorer/ · draw</b>: Type 42 in the seed box and press <span class="ch btn">Draw</span>. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/explorer--enter.png" style="width:420px" alt=""><figcaption><b>/explorer/ · enter</b>: Type any number you like in the <span class="ch btn">seed</span> box and press Enter. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/explorer--archipelago.png" style="width:420px" alt=""><figcaption><b>/explorer/ · archipelago</b>: On the Broadside, open <span class="ch word">type</span> and choose <span class="ch opt">archipelago</span>. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/explorer--islands.png" style="width:420px" alt=""><figcaption><b>/explorer/ · islands</b>: A new row has come: drag <span class="ch word">islands</span> from <span class="ch word">few</span> toward <span class="ch word">many</span>, then let go. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/explorer--sizes.png" style="width:420px" alt=""><figcaption><b>/explorer/ · sizes</b>: Now <span class="ch word">sizes</span> has come too: choose <span class="ch word">of every size</span>. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/explorer--climate.png" style="width:420px" alt=""><figcaption><b>/explorer/ · climate</b>: Open <span class="ch word">climate</span> and choose <span class="ch opt">polar</span>. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/explorer--shape.png" style="width:420px" alt=""><figcaption><b>/explorer/ · shape</b>: Type Iceland in the <span class="ch word">shape</span> box, and choose it from the list. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/explorer--held.png" style="width:420px" alt=""><figcaption><b>/explorer/ · held</b>: With Iceland still in the box, choose <span class="ch opt">archipelago</span> from <span class="ch word">type</span>. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/explorer--sea-level.png" style="width:420px" alt=""><figcaption><b>/explorer/ · sea-level</b>: Drag <span class="ch word">sea level</span> slowly toward <span class="ch word">more sea</span>. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/explorer--coast.png" style="width:420px" alt=""><figcaption><b>/explorer/ · coast</b>: Drag the <span class="ch word">coast</span> from <span class="ch word">calm</span> toward <span class="ch word">lobed</span>, then let go. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/explorer--ragged.png" style="width:420px" alt=""><figcaption><b>/explorer/ · ragged</b>: On a counted archipelago the coast row runs <span class="ch word">round</span> to <span class="ch word">ragged</span>: drag it toward <span class="ch word">ragged</span>, and let go. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/explorer--looseness.png" style="width:420px" alt=""><figcaption><b>/explorer/ · looseness</b>: With Iceland's shape on the chart, drag <span class="ch word">looseness</span> from <span class="ch word">exact</span> toward <span class="ch word">loose</span>. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/explorer--style.png" style="width:420px" alt=""><figcaption><b>/explorer/ · style</b>: Open <span class="ch word">style</span> and choose <span class="ch opt">ink</span>. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/explorer--theme.png" style="width:420px" alt=""><figcaption><b>/explorer/ · theme</b>: Open <span class="ch word">theme</span> and choose <span class="ch opt">rainfall</span>. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/explorer--arms.png" style="width:420px" alt=""><figcaption><b>/explorer/ · arms</b>: Tick <span class="ch word">arms</span>. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/explorer--beasts.png" style="width:420px" alt=""><figcaption><b>/explorer/ · beasts</b>: Tick <span class="ch word">beasts</span>. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/explorer--survey.png" style="width:420px" alt=""><figcaption><b>/explorer/ · survey</b>: Tick <span class="ch word">survey</span>. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/explorer--legend.png" style="width:420px" alt=""><figcaption><b>/explorer/ · legend</b>: Untick <span class="ch word">legend</span>, then tick it again. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/explorer--nearer.png" style="width:420px" alt=""><figcaption><b>/explorer/ · nearer</b>: Press <span class="ch btn">Draw nearer</span>, the + by the chart. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/explorer--look-about.png" style="width:420px" alt=""><figcaption><b>/explorer/ · look-about</b>: Drag the chart to look about it. Or click it, and use the arrow keys. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/explorer--anew.png" style="width:420px" alt=""><figcaption><b>/explorer/ · anew</b>: Keep pressing <span class="ch btn">Draw nearer</span> until the chart is drafted anew. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/explorer--hold.png" style="width:420px" alt=""><figcaption><b>/explorer/ · hold</b>: Press <span class="ch btn">Hold the sheet</span>, the anchor. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/explorer--loupe.png" style="width:420px" alt=""><figcaption><b>/explorer/ · loupe</b>: Press <span class="ch btn">The loupe</span>, or hold the L key with the chart in hand. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/explorer--stand-off.png" style="width:420px" alt=""><figcaption><b>/explorer/ · stand-off</b>: Press <span class="ch btn">Stand off</span> to step back, or <span class="ch btn">The whole sheet</span> to see it all again. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/explorer--in-hand.png" style="width:420px" alt=""><figcaption><b>/explorer/ · in-hand</b>: On a tablet, press <span class="ch btn">The chart in hand</span>, the pointing hand, before you pinch. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/explorer--card.png" style="width:420px" alt=""><figcaption><b>/explorer/ · card</b>: Click <span class="ch btn">Laukuwelua</span>, the capital. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/explorer--view-prospect.png" style="width:420px" alt=""><figcaption><b>/explorer/ · view-prospect</b>: On the card, press <span class="ch btn">View the prospect</span>. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/explorer--take-road.png" style="width:420px" alt=""><figcaption><b>/explorer/ · take-road</b>: Or press <span class="ch btn">Take the road</span>. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/explorer--lay-prospect.png" style="width:420px" alt=""><figcaption><b>/explorer/ · lay-prospect</b>: Or press <span class="ch btn">Lay the prospect on the table</span>. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/explorer--verso.png" style="width:420px" alt=""><figcaption><b>/explorer/ · verso</b>: Press <span class="ch road"><i>Turn</i> <b>The Sheet</b></span>. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/explorer--to-print.png" style="width:420px" alt=""><figcaption><b>/explorer/ · to-print</b>: Press <span class="ch road"><i>Take to</i> <b>The Print Room</b></span> to take this world home. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/explorer--to-journal.png" style="width:420px" alt=""><figcaption><b>/explorer/ · to-journal</b>: Press <span class="ch road"><i>Read the journal in</i> <b>The Reading Room</b></span> to watch it live. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/explorer--dog-ear.png" style="width:420px" alt=""><figcaption><b>/explorer/ · dog-ear</b>: Draw nearer until the chart is drafted anew, then press the survey's turned-up corner. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/explorer--drawer.png" style="width:420px" alt=""><figcaption><b>/explorer/ · drawer</b>: Press <span class="ch btn">The Drawer</span> at the right edge. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/explorer--to-portfolio.png" style="width:420px" alt=""><figcaption><b>/explorer/ · to-portfolio</b>: Press <span class="ch road"><i>Take the table to</i> <b>The Portfolio</b></span>. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/explorer--commission.png" style="width:420px" alt=""><figcaption><b>/explorer/ · commission</b>: Your commission: a polar archipelago of about forty islands, of every size, in the nautical style with its arms. Lay one survey of it on the table. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/prospect--enter.png" style="width:420px" alt=""><figcaption><b>/prospect/ · enter</b>: In the Explorer, click a town and press <span class="ch btn">View the prospect</span>. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/prospect--note.png" style="width:420px" alt=""><figcaption><b>/prospect/ · note</b>: Read <span class="ch btn">The engraver's note</span>. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/prospect--year.png" style="width:420px" alt=""><figcaption><b>/prospect/ · year</b>: Type an earlier year, 300, in <span class="ch btn">viewed in the year</span>, and press <span class="ch btn">Engrave</span>. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/prospect--lay.png" style="width:420px" alt=""><figcaption><b>/prospect/ · lay</b>: Press <span class="ch btn">Lay this prospect on the table</span>. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/prospect--road.png" style="width:420px" alt=""><figcaption><b>/prospect/ · road</b>: Press <span class="ch road"><i>Take the road from Laukuwelua in</i> <b>The Wayfarer's Ribbon</b></span>. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/ribbon--enter.png" style="width:420px" alt=""><figcaption><b>/ribbon/ · enter</b>: In the Explorer, click a town and press <span class="ch btn">Take the road</span>. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/ribbon--bound-for.png" style="width:420px" alt=""><figcaption><b>/ribbon/ · bound-for</b>: Choose another town from <span class="ch btn">bound for</span>. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/ribbon--turn-about.png" style="width:420px" alt=""><figcaption><b>/ribbon/ · turn-about</b>: Press <span class="ch btn">Turn about</span>. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/ribbon--lean.png" style="width:420px" alt=""><figcaption><b>/ribbon/ · lean</b>: Press a row of the itinerary. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/ribbon--pill.png" style="width:420px" alt=""><figcaption><b>/ribbon/ · pill</b>: Press <span class="ch btn">prospect</span> on a town's row. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/ribbon--end.png" style="width:420px" alt=""><figcaption><b>/ribbon/ · end</b>: Press <span class="ch road"><i>See Homaitani in</i> <b>The Prospect</b></span>, the road out to the road's end. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/explorer-portfolio--bare.png" style="width:420px" alt=""><figcaption><b>/explorer/portfolio/ · bare</b>: Open the Portfolio with nothing gathered. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/explorer-portfolio--turn-down.png" style="width:420px" alt=""><figcaption><b>/explorer/portfolio/ · turn-down</b>: In the Explorer, draw nearer until the chart is drafted anew, and press the survey's turned-up corner. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/explorer-portfolio--take.png" style="width:420px" alt=""><figcaption><b>/explorer/portfolio/ · take</b>: Open <span class="ch btn">The Drawer</span> and press <span class="ch road"><i>Take the table to</i> <b>The Portfolio</b></span>. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/explorer-portfolio--next.png" style="width:420px" alt=""><figcaption><b>/explorer/portfolio/ · next</b>: Press <span class="ch road"><i>Bring up</i> <b>The Next Sheet</b></span>. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/explorer-portfolio--download.png" style="width:420px" alt=""><figcaption><b>/explorer/portfolio/ · download</b>: Press <span class="ch road"><i>Download</i> <b>The Engraving</b></span>. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/explorer-portfolio--keep.png" style="width:420px" alt=""><figcaption><b>/explorer/portfolio/ · keep</b>: Copy the address from the bar. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/writing-room--write.png" style="width:420px" alt=""><figcaption><b>/writing-room/ · write</b>: In <span class="ch btn">the founding sentence</span> box, write &quot;a polar archipelago of twenty islands&quot;, then press <span class="ch btn">Found</span>. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/writing-room--your-word.png" style="width:420px" alt=""><figcaption><b>/writing-room/ · your-word</b>: Add your own name to the end of the sentence, and press <span class="ch btn">Found</span> again. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/writing-room--shape-of.png" style="width:420px" alt=""><figcaption><b>/writing-room/ · shape-of</b>: Write &quot;an island in the shape of Japan&quot;, and press <span class="ch btn">Found</span>. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/writing-room--plate.png" style="width:420px" alt=""><figcaption><b>/writing-room/ · plate</b>: Press <span class="ch road"><i>Lay on</i> <b>The Vegetation Plate</b></span>. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/writing-room--explore-it.png" style="width:420px" alt=""><figcaption><b>/writing-room/ · explore-it</b>: Press <span class="ch road"><i>Explore it in</i> <b>The Explorer</b></span>. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/writing-room--commission.png" style="width:420px" alt=""><figcaption><b>/writing-room/ · commission</b>: Your commission: write a sentence for a world you would like to visit, and send its link to a friend. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/reading-room--play.png" style="width:420px" alt=""><figcaption><b>/reading-room/ · play</b>: Press <span class="ch btn">Play</span>. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/reading-room--pace.png" style="width:420px" alt=""><figcaption><b>/reading-room/ · pace</b>: Press <span class="ch btn">2×</span> or <span class="ch btn">4×</span> to hurry it. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/reading-room--ages.png" style="width:420px" alt=""><figcaption><b>/reading-room/ · ages</b>: Drag <span class="ch btn">The ages</span> to any year. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/reading-room--journal.png" style="width:420px" alt=""><figcaption><b>/reading-room/ · journal</b>: Read <span class="ch btn">The Journal</span> at the right. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/reading-room--this-road.png" style="width:420px" alt=""><figcaption><b>/reading-room/ · this-road</b>: On a road leg's row in the Journal, press <span class="ch btn">Take this road</span> once the voyage has reached it. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/reading-room--read.png" style="width:420px" alt=""><figcaption><b>/reading-room/ · read</b>: Type a seed and press <span class="ch btn">Read</span>, or press <span class="ch glyph">⚄</span>. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/print-room--pull.png" style="width:420px" alt=""><figcaption><b>/print-room/ · pull</b>: Type 42 and press <span class="ch btn">Pull a proof</span>. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/print-room--style.png" style="width:420px" alt=""><figcaption><b>/print-room/ · style</b>: Choose <span class="ch opt">ink</span> beside it, and pull again. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/print-room--bind.png" style="width:420px" alt=""><figcaption><b>/print-room/ · bind</b>: Press <span class="ch btn">Bind the atlas</span>. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/print-room--turn.png" style="width:420px" alt=""><figcaption><b>/print-room/ · turn</b>: In the Contents, press a thumbnail. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/print-room--keep.png" style="width:420px" alt=""><figcaption><b>/print-room/ · keep</b>: Press <span class="ch btn">Print</span> to save the atlas as a PDF, or <span class="ch btn">Download</span> for one file that opens offline. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/print-room--impression.png" style="width:420px" alt=""><figcaption><b>/print-room/ · impression</b>: Choose <span class="ch opt">An impression (PNG)</span>, then press <span class="ch btn">Desk</span>. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/print-room--road-plate.png" style="width:420px" alt=""><figcaption><b>/print-room/ · road-plate</b>: Choose <span class="ch opt">The road from the capital</span> from the first list; the first press now reads <span class="ch btn">Ribbon</span>: press it. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/print-room--back.png" style="width:420px" alt=""><figcaption><b>/print-room/ · back</b>: Press <span class="ch road"><i>Back to</i> <b>The Explorer</b></span>. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/seed-of-the-day--notes.png" style="width:420px" alt=""><figcaption><b>/seed-of-the-day/ · notes</b>: Read the survey notes on <span class="ch btn">The Daily Hunt</span>. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/seed-of-the-day--sound.png" style="width:420px" alt=""><figcaption><b>/seed-of-the-day/ · sound</b>: Click the chart where you think it hides. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/seed-of-the-day--share.png" style="width:420px" alt=""><figcaption><b>/seed-of-the-day/ · share</b>: When you find it, press <span class="ch btn">Share your find</span>. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/seed-of-the-day--dispatch.png" style="width:420px" alt=""><figcaption><b>/seed-of-the-day/ · dispatch</b>: Press <span class="ch btn">Draft dispatch</span>. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/seed-of-the-day--to-explorer.png" style="width:420px" alt=""><figcaption><b>/seed-of-the-day/ · to-explorer</b>: Press <span class="ch road"><i>Open today's seed in</i> <b>The Explorer</b></span>. <span class="m">check passes</span></figcaption></figure><figure style="width:420px"><img src="/out/1155/shots/pictures/gallery--look.png" style="width:420px" alt=""><figcaption>
