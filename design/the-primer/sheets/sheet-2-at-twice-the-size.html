</style></head><body><h1>The same, cropped at twice the size, where the words are read</h1><p class="intro">Legibility lives here and glance lives on the first sheet. Each crop is the same shot as its full-scale still, at device scale 2.</p><div class="row"><figure style="width:860px"><img src="/out/1155/shots/stills/control-portfolio-plate-2x.png" style="width:860px" alt=""><figcaption>Today: the Portfolio's first visit, its three-step plate, the house's one piece of in-page how-to, at twice its size. <code>shots/stills/control-portfolio-plate-2x.png</code></figcaption></figure><figure style="width:860px"><img src="/out/1155/shots/stills/control-faq-2x.png" style="width:860px" alt=""><figcaption>Today: Questions &amp; Answers at its nearest thing to a step, 'I found a map I love', at twice its size. <code>shots/stills/control-faq-2x.png</code></figcaption></figure><figure style="width:860px"><img src="/out/1155/shots/stills/control-footnote-2x.png" style="width:860px" alt=""><figcaption>Today: help in place, the shape row's note open on the Broadside, at twice its size. <code>shots/stills/control-footnote-2x.png</code></figcaption></figure></div>
<div class="row"><figure style="width:860px"><img src="/out/1155/shots/stills/a-land-2x.png" style="width:860px" alt=""><figcaption>A: the Land, each control drawn as itself in the sentence, the room once done beside it, at twice its size. <code>shots/stills/a-land-2x.png</code></figcaption></figure><figure style="width:600px"><img src="/out/1155/shots/stills/b-before-2x.png" style="width:600px" alt=""><figcaption>B, the Schoolroom: step 4, the real type row left in its own panel and every row not yet reached withheld, the Glass, the Press and the Drawer withheld too, at twice its size. <code>shots/stills/b-before-2x.png</code></figcaption></figure><figure style="width:1100px"><img src="/out/1155/shots/stills/c-explorer-2x.png" style="width:1100px" alt=""><figcaption>C: the Explorer's tour at the Land's first step, the type list ringed where it stands, at twice its size. <code>shots/stills/c-explorer-2x.png</code></figcaption></figure></div>
<div class="row"><figure style="width:1100px"><img src="/out/1155/shots/stills/d-explorer-done-2x.png" style="width:1100px" alt=""><figcaption>D: the same step once the islands slider is let go: the room sees the readout move and offers the next step, at twice its size. <code>shots/stills/d-explorer-done-2x.png</code></figcaption></figure><figure style="width:1000px"><img src="/out/1155/shots/stills/e-chart-2x.png" style="width:1000px" alt=""><figcaption>E, the chart of lessons: the Primer opens on the atelier's own chart drawn large, each lesson a waypoint on the road, those done inked, at twice its size. <code>shots/stills/e-chart-2x.png</code></figcaption></figure><figure style="width:600px"><img src="/out/1155/shots/stills/a-closing-2x.png" style="width:600px" alt=""><figcaption>A: the closing note, what to lean on afterwards and how to begin again, at twice its size. <code>shots/stills/a-closing-2x.png</code></figcaption></figure></div></body></html>
